<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag forces the browser to refresh the whole page every 600 seconds (10 minutes) -->
    <meta http-equiv="refresh" content="600">
    <title>Kiosk Display - Google Slides</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Loads your exact presentation with auto-play, loop, and 5-second slide duration enabled -->
    <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vSrxh7PvdQz5lgi8K2PneLxR05wSezKjVfzYP1_WAO4HsTW6hAv_AbFgZJhet7RZzIlbJhZzpv-ho8c/pubembed?start=true&loop=true&delayms=5000" frameborder="0" width="1440" height="839" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
</body>
</html>
